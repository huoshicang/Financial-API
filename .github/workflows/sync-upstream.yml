name: Sync upstream

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 2:00（= 北京时间 10:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Merge upstream
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add upstream https://github.com/HiThink-Tech/Financial-API.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
